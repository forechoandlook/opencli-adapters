site: zhihu
name: user
description: "读取指定用户尽可能完整的回答、文章、视频、想法；--all true 时自动翻页"
domain: www.zhihu.com
strategy: cookie
browser: true
timeoutSeconds: 180

args:
  user:
    type: str
    required: true
    positional: true
    description: "url_token、个人主页 URL，或用户昵称"
  type:
    type: str
    default: all
    choices: [all, answer, article, zvideo, pin]
    description: "内容类型；all 依次拉取回答、文章、视频、想法"
  limit:
    type: int
    default: 40
    description: "每种类型最多返回条数；--all true 时忽略"
  all:
    type: bool
    default: false
    description: "翻页直到该类型没有更多；单类型最多 3000 条"
  incremental:
    type: bool
    default: false
    description: "若本地已记录该用户最新内容，则仅返回更新部分，并更新游标"

columns: [kind, id, rank, title, date, votes, cover, media_urls, url, download_command]

pipeline:
  - evaluate:
      retry: false
      js: |
        (() => ({ latest: {} }))()
  - navigate:
      url: https://www.zhihu.com/
      waitUntil: commit
      reuseExistingTab: true
  - evaluate:
      retry: false
      js: |
        (() => {
          const raw = String(args.user || '').trim();
          let token = raw.replace(/[?#].*$/, '');
          const peopleMatch = token.match(/zhihu\.com\/people\/([^/?#]+)/) || token.match(/zhihu\.com\/org\/([^/?#]+)/);
          if (peopleMatch) token = decodeURIComponent(peopleMatch[1]);
          token = token.replace(/\/+$/, '').split('/').pop() || token;
          return {
            raw,
            token,
            latest: data.latest || {}
          };
        })()
  - kv_get:
      key: zhihu:user:${{ data.token }}:latest
      field: latest
      only_if_empty: true
  - evaluate:
      retry: false
      js: |
        (async () => {
          const raw = String(data.raw || args.user || '').trim();
          const kindFilter = String(args.type || 'all').toLowerCase();
          const wantAll = Boolean(args.all);
          const wantIncremental = Boolean(args.incremental);
          const perKindLimit = wantAll ? 3000 : Math.max(Number(args.limit) || 40, 1);
          const pageSize = 20;
          const MAX_PAGES = 150;
          const latestMarkers = (data.latest && typeof data.latest === 'object') ? data.latest : {};

          const get = async (url) => {
            const response = await fetch(url, { credentials: 'include', headers: { 'x-requested-with': 'fetch' } });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload?.error) {
              const msg = String(payload?.error?.message || response.status || '');
              // Deleted / empty accounts: return empty instead of hard-fail for batch jobs.
              if (/注销|不存在|找不到|没有权限|未找到|已重置|reseted/i.test(msg) || response.status === 404) {
                return { data: [], paging: { is_end: true }, _soft_empty: true, _message: msg };
              }
              throw new Error('知乎接口失败: ' + msg + ' ' + url);
            }
            return payload;
          };
          const strip = (html) => String(html || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
          const toIso = (value) => {
            const n = Number(value || 0);
            return Number.isFinite(n) && n > 0 ? new Date(n * 1000).toISOString().slice(0, 10) : '';
          };
          const mediaUrls = (item) => {
            const urls = [];
            const add = value => {
              let url = String(value || '').trim();
              if (url.startsWith('//')) url = 'https:' + url;
              if (/^https?:\/\//i.test(url) && !url.startsWith('data:')) urls.push(url);
            };
            add(item?.image_url);
            add(item?.thumbnail);
            add(item?.video?.thumbnail);
            for (const entry of Array.isArray(item?.content) ? item.content : []) {
              add(entry?.url || entry?.image_url || entry?.original_url);
            }
            const html = typeof item?.content === 'string' ? item.content : '';
            for (const match of html.matchAll(/<img[^>]+(?:data-original|data-actualsrc|data-src|src)=["']([^"']+)["']/gi)) add(match[1]);
            return [...new Set(urls)];
          };
          const withMedia = (row, item) => {
            const urls = mediaUrls(item);
            return { ...row, cover: urls[0] || '', media_urls: urls, download_command: row.url ? ('opencli zhihu download ' + JSON.stringify(row.url)) : '' };
          };

          let token = String(data.token || '').trim();

          if (!token) throw new Error('缺少用户标识');

          // If the token looks like a display name, resolve via search.
          if (/[\u4e00-\u9fff\s]/.test(token) || token.length < 2) {
            const search = await get('https://www.zhihu.com/api/v4/search_v3?t=people&q=' + encodeURIComponent(raw) + '&limit=5');
            const hit = (search?.data || []).map(item => item.object || item).find(obj => obj?.url_token || obj?.type === 'people');
            if (hit?.url_token) token = hit.url_token;
          }

          const rows = [];
          const latestSeen = {};
          const want = (k) => kindFilter === 'all' || kindFilter === k;

          const endpoints = [];
          if (want('answer')) endpoints.push({
            kind: 'answer',
            url: (offset) => 'https://www.zhihu.com/api/v4/members/' + encodeURIComponent(token) + '/answers?include=data[*].is_normal,content,voteup_count,created_time,updated_time,question&offset=' + offset + '&limit=' + pageSize + '&sort_by=created',
            map: (item, rank) => withMedia({
              kind: 'answer',
              id: String(item.id || ''),
              rank,
              title: strip(item.question?.title || item.title || ''),
              date: toIso(item.created_time),
              votes: Number(item.voteup_count || 0),
              url: item.question?.id && item.id
                ? 'https://www.zhihu.com/question/' + item.question.id + '/answer/' + item.id
                : (item.url || '')
            }, item)
          });
          if (want('article')) endpoints.push({
            kind: 'article',
            url: (offset) => 'https://www.zhihu.com/api/v4/members/' + encodeURIComponent(token) + '/articles?include=data[*].voteup_count,created,updated,content,image_url&offset=' + offset + '&limit=' + pageSize + '&sort_by=created',
            map: (item, rank) => withMedia({
              kind: 'article',
              id: String(item.id || ''),
              rank,
              title: strip(item.title || ''),
              date: toIso(item.created || item.created_time),
              votes: Number(item.voteup_count || 0),
              url: item.id ? 'https://zhuanlan.zhihu.com/p/' + item.id : (item.url || '')
            }, item)
          });
          if (want('zvideo')) endpoints.push({
            kind: 'zvideo',
            url: (offset) => 'https://www.zhihu.com/api/v4/members/' + encodeURIComponent(token) + '/zvideos?offset=' + offset + '&limit=' + pageSize,
            map: (item, rank) => withMedia({
              kind: 'zvideo',
              id: String(item.id || item.video_id || ''),
              rank,
              title: strip(item.title || item.name || ''),
              date: toIso(item.published_at || item.created_at || item.created_time),
              votes: Number(item.voteup_count || item.liked_count || 0),
              url: item.video_id || item.id
                ? 'https://www.zhihu.com/zvideo/' + (item.id || item.video_id)
                : (item.url || '')
            }, item)
          });
          if (want('pin')) endpoints.push({
            kind: 'pin',
            url: (offset) => 'https://www.zhihu.com/api/v4/members/' + encodeURIComponent(token) + '/pins?offset=' + offset + '&limit=' + pageSize,
            map: (item, rank) => withMedia({
              kind: 'pin',
              id: String(item.id || ''),
              rank,
              title: strip(item.excerpt_title || item.content?.[0]?.own_text || item.content?.[0]?.title || '').slice(0, 120),
              date: toIso(item.created || item.created_time),
              votes: Number(item.like_count || item.reaction_count || 0),
              url: item.id ? 'https://www.zhihu.com/pin/' + item.id : (item.url || '')
            }, item)
          });

          for (const ep of endpoints) {
            let offset = 0;
            let rank = 1;
            let pages = 0;
            let hitMarker = false;
            const marker = String(latestMarkers?.[ep.kind]?.id || '');
            while (pages < MAX_PAGES && rank <= perKindLimit) {
              const payload = await get(ep.url(offset));
              const page = Array.isArray(payload?.data) ? payload.data : [];
              if (!page.length) break;
              for (const item of page) {
                if (rank > perKindLimit) break;
                const row = ep.map(item, rank);
                if (rank === 1 && row.id) latestSeen[ep.kind] = { id: row.id, url: row.url, date: row.date };
                if (wantIncremental && marker && row.id === marker) {
                  hitMarker = true;
                  break;
                }
                rows.push(row);
                rank += 1;
              }
              if (hitMarker || payload?.paging?.is_end || page.length < pageSize) break;
              offset += page.length;
              pages += 1;
            }
          }

          // Empty/deleted profiles return [] so batch archives can continue.
          return {
            token,
            latest_seen: latestSeen,
            rows
          };
        })()
  - kv_set:
      key: zhihu:user:${{ data.token }}:latest
      value: ${{ data.latest_seen }}
      skip_empty: true
  - select: rows
