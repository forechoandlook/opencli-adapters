site: douyin
name: search
description: 搜索抖音视频；返回可直接传给 detail/download 的 aweme_id
domain: www.douyin.com
strategy: cookie
browser: true

args:
  query:
    positional: true
    type: string
    required: true
    description: 搜索关键词
  limit:
    type: int
    default: 20
    description: 最多返回当前搜索页已加载的结果数（1-50，不自动滚动或翻页）

columns: [rank, aweme_id, title, author, likes, duration, published, url]

pipeline:
  - navigate:
      url: https://www.douyin.com/search/${{ args.query | urlencode }}?type=video
      settleMs: 3000
      retry: false
  - evaluate: |
      (() => {
        const limit = Math.min(Math.max(Number(args.limit) || 20, 1), 50);
        const clean = value => String(value || '').replace(/\s+/g, ' ').trim();
        const seen = new Set();
        const rows = [];
        for (const card of document.querySelectorAll('.search-result-card')) {
          const link = card.querySelector('a[href*="/video/"]');
          const href = link?.getAttribute('href') || '';
          const id = href.match(/\/video\/(\d+)/)?.[1] || '';
          if (!id || seen.has(id)) continue;
          seen.add(id);
          const lines = String(card.innerText || '').split('\n').map(clean).filter(Boolean);
          const authorAt = lines.findIndex(line => line.startsWith('@'));
          const author = authorAt >= 0 ? lines[authorAt].replace(/^@/, '') : '';
          const duration = lines.find(line => /^\d{1,2}:\d{2}(?::\d{2})?$/.test(line)) || '';
          const durationAt = lines.indexOf(duration);
          const likes = durationAt >= 0 ? (lines[durationAt + 1] || '') : '';
          const title = lines.slice(Math.max(durationAt + 2, 0), authorAt >= 0 ? authorAt : lines.length)
            .filter(line => line !== '合集').join(' ') || id;
          const published = authorAt >= 0 ? (lines[authorAt + 1] || '') : '';
          rows.push({
            rank: rows.length + 1,
            aweme_id: id,
            title: clean(title),
            author: clean(author),
            likes: clean(likes),
            duration,
            published: clean(published),
            url: 'https://www.douyin.com/video/' + id,
          });
          if (rows.length >= limit) break;
        }
        if (!rows.length) throw new Error('搜索页尚未提供视频结果；请确认登录状态或稍后重试');
        return rows;
      })()
