site: bilibili
name: user-videos
description: 查看指定用户的投稿视频
domain: www.bilibili.com
strategy: cookie

args:
  uid:
    type: str
    required: true
    positional: true
    description: User UID or username
  limit:
    type: int
    default: 20
    description: 最多返回条数（超出 50 自动翻页）
  order:
    default: pubdate
    description: "Sort: pubdate, click, stow"
  page:
    type: int
    default: 1
    description: Page number

capabilities:
  auth: true
  paginate: true

columns: [rank, bvid, title, plays, likes, date, url]

pipeline:
  - navigate: https://www.bilibili.com

  - evaluate:
      helpers: [wbi]
      js: |
        (async () => {
        const uidInput = String(args.uid);
        const limit = Math.max(Number(args.limit) || 20, 1);
        const order = args.order || 'pubdate';
        const startPage = Math.max(Number(args.page) || 1, 1);
        const pageSize = 50;

        let uid = uidInput;
        if (!/^\d+$/.test(uid)) {
          const searchResp = await fetch('https://api.bilibili.com/x/web-interface/search/type?search_type=bili_user&keyword=' + encodeURIComponent(uid), { credentials: 'include' });
          const searchData = await searchResp.json();
          const results = searchData?.data?.result || [];
          if (results.length > 0) uid = String(results[0].mid);
          else throw new Error('Cannot resolve UID for: ' + uidInput);
        }

        async function fetchPage(pn) {
          const payload = await wbiGet('/x/space/wbi/arc/search', {
            mid: uid,
            order: order,
            pn: String(pn),
            ps: String(pageSize)
          });
          if (payload.code !== 0) {
            throw new Error('API error ' + payload.code + ': ' + (payload.message || 'unknown'));
          }
          return payload?.data || {};
        }

        const rows = [];
        let pn = startPage;
        const maxPages = Math.ceil(limit / pageSize) + 2;
        for (let i = 0; i < maxPages && rows.length < limit; i++) {
          const payload = await fetchPage(pn);
          const vlist = payload?.list?.vlist || [];
          if (!vlist.length) break;
          for (const item of vlist) {
            if (rows.length >= limit) break;
            rows.push({
              rank: rows.length + 1,
              bvid: item.bvid || '',
              title: item.title || '',
              plays: item.play || 0,
              likes: item.like || 0,
              date: item.created ? new Date(item.created * 1000).toISOString().slice(0, 10) : '',
              url: item.bvid ? 'https://www.bilibili.com/video/' + item.bvid : ''
            });
          }
          const total = Number(payload?.page?.count || 0);
          if (vlist.length < pageSize || (total > 0 && rows.length >= total)) break;
          pn += 1;
        }
        return rows;
        })()
