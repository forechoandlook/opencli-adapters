site: bilibili
name: following
description: "获取 Bilibili 用户的关注列表；--all true 时自动翻页"
domain: www.bilibili.com
strategy: cookie

args:
  uid:
    positional: true
    description: 目标用户 ID（默认为当前登录用户）
  page:
    type: int
    default: 1
    description: 页码
  limit:
    type: int
    default: 50
    description: "最多返回条数（单次请求最多 50，超出自动翻页）；--all true 时忽略"
  all:
    type: bool
    default: false
    description: "自动翻页，尽可能获取全部关注用户（最多 5000 人）"
  max-results:
    type: int
    default: 5000
    description: "--all true 时的安全上限"
  refresh:
    type: bool
    default: false
    description: "忽略本地 KV 中的关注列表与 WBI 缓存"

capabilities:
  auth: true
  paginate: true

columns: [mid, name, sign, following, fans, avatar]

pipeline:
  # When uid omitted, fill mid from opencli KV before hitting nav.
  - evaluate:
      retry: false
      js: |
        (() => {
          const uidInput = String(args.uid || '').trim();
          if (!uidInput || uidInput === 'undefined') {
            return { uid: '', self: true };
          }
          if (/^\d+$/.test(uidInput)) {
            return { uid: uidInput, self: false };
          }
          return { uid: uidInput, self: false, needSearch: true };
        })()
  - kv_get:
      key: bilibili:me.mid
      field: uid
      only_if_empty: true
  - kv_get:
      key: bilibili:wbi.keys
      field: wbi
      only_if_empty: true
  - kv_get:
      key: bilibili:following:${{ data.uid }}:list
      field: cached_list
      only_if_empty: true
  - navigate: https://www.bilibili.com

  - evaluate:
      helpers: [wbi]
      retry: false
      js: |
        (async () => {
        const uidInput = String(args.uid || '').trim();
        const startPage = Math.max(Number(${{ args.page }}) || 1, 1);
        const wantAll = Boolean(${{ args.all | default(false) | json }});
        const pageSize = 50;
        const maxResults = wantAll
          ? Math.min(Math.max(Number(${{ args['max-results'] | default(5000) | json }}) || 5000, 1), 5000)
          : Math.min(Math.max(Number(${{ args.limit }}) || 50, 1), 5000);
        let uid = String(data.uid || '').trim();
        let isSelf = !uidInput || uidInput === 'undefined';
        const refresh = Boolean(${{ args.refresh | default(false) | json }});
        const cached = Array.isArray(data.cached_list) ? data.cached_list : [];
        if (!refresh && /^\d+$/.test(uid) && cached.length >= maxResults) {
          return { mid: isSelf ? uid : '', uid, rows: cached.slice(0, maxResults), wbi: data.wbi || {}, from_cache: true };
        }

        async function apiGet(path, params, signed) {
          if (signed) return await wbiGet(path, params);
          const qs = new URLSearchParams(
            Object.fromEntries(Object.entries(params).map(([k, v]) => [k, String(v)]))
          ).toString().replace(/\+/g, '%20');
          const url = 'https://api.bilibili.com' + path + '?' + qs;
          const res = await fetch(url, { credentials: 'include' });
          return await res.json();
        }

        // Resolve target mid: self (KV/nav) | numeric uid | username search
        if (isSelf) {
          if (!/^\d+$/.test(uid)) {
            const navRes = await fetch('https://api.bilibili.com/x/web-interface/nav', { credentials: 'include' });
            const nav = await navRes.json();
            uid = String(nav?.data?.mid || '').trim();
            if (!/^\d+$/.test(uid)) throw new Error('AUTH_REQUIRED: bilibili.com');
          }
        } else if (/^\d+$/.test(uidInput)) {
          uid = uidInput;
        } else {
          const payload = await apiGet('/x/web-interface/wbi/search/type', {
            search_type: 'bili_user',
            keyword: uidInput
          }, true);
          const results = payload?.data?.result || [];
          if (results.length > 0) {
            uid = String(results[0].mid);
          } else {
            throw new Error('Cannot resolve UID for: ' + uidInput);
          }
        }

        const rows = [];
        let pn = startPage;
        let total = 0;
        while (rows.length < maxResults) {
          // Keep ps stable across pages: Bilibili derives the offset from
          // pn * ps, so shrinking the last request would duplicate rows.
          const ps = pageSize;
          const res = await fetch(
            'https://api.bilibili.com/x/relation/followings?vmid=' + uid + '&pn=' + pn + '&ps=' + ps + '&order=desc',
            { credentials: 'include' }
          );
          const payload = await res.json();
          if (payload.code !== 0) {
            throw new Error('获取关注列表失败: ' + payload.message + ' (' + payload.code + ')');
          }
          const list = payload.data?.list || [];
          total = Number(payload.data?.total || total || 0);
          for (const u of list) {
            rows.push({
              mid: u.mid,
              name: u.uname,
              sign: (u.sign || '').slice(0, 40),
              following: u.attribute === 6 ? '互相关注' : '已关注',
              fans: u.official_verify?.desc || '',
              avatar: String(u.face || '')
            });
            if (rows.length >= maxResults) break;
          }
          if (!wantAll || !list.length || list.length < ps || rows.length >= total) break;
          pn += 1;
        }

        if (!rows.length) {
          rows.push({ mid: '-', name: '共 ' + total + ' 人关注，当前页无数据', sign: '', following: '', fans: '', avatar: '' });
        }

          return {
            // Only cache when this run resolved *self*
            mid: isSelf ? uid : '',
            uid,
            rows,
            wbi: currentWbiKeys()
          };
        })()
  - kv_set:
      key: bilibili:me.mid
      value: ${{ data.mid }}
      ttl: 30d
      skip_empty: true
  - kv_set:
      key: bilibili:wbi.keys
      value: ${{ data.wbi }}
      ttl: 6h
      skip_empty: true
  - kv_set:
      key: bilibili:following:${{ data.uid }}:list
      value: ${{ data.rows }}
      ttl: 1h
      skip_empty: true
  - select: rows
